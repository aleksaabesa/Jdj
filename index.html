<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ფაილის გადმოწერა</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .download-btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s, transform 0.2s;
            font-weight: bold;
        }
        .download-btn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
        .download-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>კეთილი იყოს თქვენი მობრძანება!</h1>
        <p>სპეციალური ფაილის ჩამოსატვირთად დააჭირეთ ქვემოთ მოცემულ ღილაკს:</p>
        
        <a href="dokumenti.pdf" download="სპეციალური_ფაილი.pdf" class="download-btn">ნახე ფაილი (გადმოწერა)</a>
    </div>

</body>
</html>
